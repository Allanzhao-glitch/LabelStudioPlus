<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>管理员后台</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #f2f2f2;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            margin: auto;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 5px;
            background: #2b72d6;
            color: white;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
        button.logout {
            background: #c0392b;
        }
        .loading {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .error {
            color: #c0392b;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>管理员后台</h1>

    <p>欢迎您，管理员！</p>
    <p>当前用户：<span id="username"></span></p>

    <button onclick="location.href='/projects'">项目管理</button>
    <button onclick="location.href='/users'">用户管理</button>

    <button class="logout" id="logoutBtn" onclick="logout()">退出登录</button>
</div>

<script>
    // 页面加载完成后执行检查
    document.addEventListener('DOMContentLoaded', function() {
        // 显示用户名
        const user = JSON.parse(localStorage.getItem("auth_user"));
        if (user) {
            document.getElementById("username").innerText = user.username;
        } else {
            // 添加错误提示，避免立即重定向以便调试
            document.getElementById("username").innerText = "未登录";
            document.querySelector('.card').innerHTML += '<p class="error">未检测到用户信息，请重新登录</p>';
            
            // 延迟重定向，让用户看到错误信息
            setTimeout(() => {
                window.location.href = "/login";
            }, 3000);
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        console.log("Admin page loaded, checking user info...");
        console.log("Current origin:", window.location.origin);
                // 禁用按钮防止重复点击
        // 显示用户名
        const userStr = localStorage.getItem("auth_user");
        console.log("User data in localStorage:", userStr);  // 调试信息
        
        if (userStr) {
            try {
                const user = JSON.parse(userStr);
                document.getElementById("username").innerText = user.username || "未知用户";
                console.log("User info displayed successfully");
            } catch (e) {
                console.error("解析用户信息失败:", e);
                document.getElementById("username").innerText = "未知用户";
            }
        } else {
            // 检查是否是通过session验证的，但localStorage中没有信息
            console.log("No user data in localStorage, but session may be valid");
            // 在这种情况下，我们相信后端的session验证
            document.getElementById("username").innerText = "管理员";
        }
    });

    function logout() {
        console.log("Logout function called");
        
        // 禁用登出按钮防止重复点击
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
            logoutBtn.disabled = true;
            logoutBtn.innerText = "正在退出...";
        }
        
        try {
            // 清除认证信息
            localStorage.removeItem("access_token");
            localStorage.removeItem("auth_user");
            localStorage.removeItem("Authorization");
            console.log("Local storage items removed");
            
            // 发起后端登出请求（可选）
            fetch('/logout', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            }).then(response => {
                console.log("Backend logout response:", response.status);
            }).catch(error => {
                console.error("Backend logout error:", error);
            });
        } catch (error) {
            console.error("Error during logout:", error);
        } finally {
            // 确保无论如何都跳转到登录页面
            console.log("Redirecting to login page");
            window.location.href = "/login";
        }
    }
</script>
</body>
</html>
